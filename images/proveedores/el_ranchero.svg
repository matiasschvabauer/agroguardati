<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" width="320" height="85">
  <defs>
    <linearGradient id="ranchero-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="6" width="312" height="73" rx="8" fill="url(#ranchero-gold)" stroke="#18181B" stroke-width="4" filter="url(#shadow)"/>
  <rect x="10" y="12" width="300" height="61" rx="4" fill="none" stroke="#18181B" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <!-- Main Title -->
  <text x="160" y="47" font-family="'Impact', 'Arial Black', 'Inter', sans-serif" font-size="33" font-weight="900" font-style="italic" fill="#18181B" text-anchor="middle" letter-spacing="1.5">
    EL RANCHERO
  </text>
  
  <!-- Subtitle -->
  <text x="160" y="65" font-family="'Inter', 'Arial', sans-serif" font-size="9.5" font-weight="800" fill="#18181B" text-anchor="middle" letter-spacing="3">
    IMPLEMENTOS AGRÍCOLAS
  </text>
</svg>